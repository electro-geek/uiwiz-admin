<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UIWiz Admin{% endblock %}</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.12);
      --text: #fff;
      --muted: rgba(255,255,255,0.5);
      --gradient-edge: rgba(255,255,255,0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    .navbar {
      position: relative;
      z-index: 1;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .navbar .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em; }
    .navbar .links { display: flex; gap: 1.25rem; align-items: center; }
    .navbar a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.95rem; }
    .navbar a:hover { color: #fff; }
    .navbar .muted { color: var(--muted); font-size: 0.9rem; }
    .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td { padding: 0.875rem 1.25rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: rgba(255,255,255,0.05); color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .key-cell { font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; max-width: 280px; color: rgba(255,255,255,0.9); }
    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      color: #0a0a0a;
      background: linear-gradient(180deg, #fff 0%, #e4e4e7 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.95; }
    .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messages li { padding: 0.5rem 1rem; border-radius: 8px; margin-bottom: 0.25rem; border: 1px solid var(--border); }
    .success { background: rgba(255,255,255,0.06); color: #a3e635; }
    .error { background: rgba(255,255,255,0.06); color: #fca5a5; border-color: rgba(248,113,113,0.3); }
    h1 { font-size: 1.5rem; font-weight: 700; margin-top: 0; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .page-desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .page-desc code { background: rgba(255,255,255,0.08); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <nav class="navbar">
    <a href="{% url 'dashboard_index' %}" class="brand">UIWiz Admin</a>
    <div class="links">
      <a href="{% url 'dashboard_index' %}">Dashboard</a>
      <a href="{% url 'chat_history' %}">Chat history</a>
      {% if user.is_authenticated %}
        <span class="muted">{{ user.get_username }}</span>
        <a href="{% url 'logout' %}">Log out</a>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block extra_js %}{% endblock %}
</body>
</html>
